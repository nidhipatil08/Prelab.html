<!DOCTYPE html>
<html>
<head>
    <title>Iframe Website</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
        }

        header {
            background-color: #2c3e50;
            color: white;
            text-align: center;
            padding: 15px;
        }

        .container {
            display: flex;
            height: 90vh;
        }

        .menu {
            width: 25%;
            background-color: #ecf0f1;
            padding: 15px;
        }

        .menu a {
            display: block;
            margin: 10px 0;
            text-decoration: none;
            color: blue;
        }

        .content {
            width: 75%;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>

</head>

<body>

<header>
    <h1>My Iframe Website</h1>
    <p>Embedding Maps & External Pages</p>
</header>

<div class="container">

    <!-- Menu -->
    <div class="menu">
        <h3>Menu</h3>
        <a href="home.html" target="contentFrame">Home</a>
        <a href="map.html" target="contentFrame">Map</a>
        <a href="about.html" target="contentFrame">About</a>
        <a href="https://www.wikipedia.org" target="contentFrame">Wikipedia</a>
    </div>

    <!-- Content -->
    <div class="content">
        <iframe  src="https://www.pw.live/" name="contentFrame" src="home.html"></iframe>
    </div>

</div>

</body>
</html>
