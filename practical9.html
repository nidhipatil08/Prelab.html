<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Webpage</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">

    <!-- Icons (Font Awesome) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background: #f4f4f4;
        }

        header {
            background: #333;
            color: white;
            text-align: center;
            padding: 20px;
        }

        /* Navigation */
        nav {
            display: flex;
            justify-content: center;
            background: #555;
        }

        nav a {
            color: white;
            padding: 15px;
            text-decoration: none;
        }

        nav a:hover {
            background: #222;
            transition: 0.3s;
        }

        /* Multi-column layout */
        .container {
            display: flex;
            flex-wrap: wrap;
            padding: 20px;
        }

        .card {
            flex: 1 1 30%;
            background: white;
            margin: 10px;
            padding: 20px;
            box-shadow: 0 0 10px gray;
            transition: transform 0.3s;
        }
         /* Transform + Animation */
         .card:hover {
            transform: scale(1.05);
        }

        .card {
            animation: fadeIn 1s ease-in;
        }

        

        .icon {
            font-size: 40px;
            color: #ff6600;
        }

        /* Animation */
        @keyframes fadeIn {
            from {opacity: 0;}
            to {opacity: 1;}
        }

       
        footer {
            text-align: center;
            padding: 10px;
            background: #333;
            color: white;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .card {
                flex: 1 1 100%;
            }
        }
    </style>
</head>
<body>

<header>
    <h1>🌐 My Responsive Webpage</h1>
    <p>Using CSS3 Features</p>
</header>

<nav>
    <a href="#">Home</a>
    <a href="#">About</a>
    <a href="#">Contact</a>
</nav>

<div class="container">

    <div class="card">
        <i class="fas fa-laptop-code icon"></i>
        <h2>Web Design</h2>
        <p>Modern and responsive designs using CSS3.</p>
    </div>

    <div class="card">
        <i class="fas fa-mobile-alt icon"></i>
        <h2>Mobile Friendly</h2>
        <p>Optimized for all screen sizes.</p>
    </div>

    <div class="card">
        <i class="fas fa-rocket icon"></i>
        <h2>Fast Performance</h2>
        <p>Lightweight and fast-loading pages.</p>
    </div>

</div>

<footer>
    
</footer>

</body>
</html>
